services:
  - type: web
    name: supreme-search-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_PER_SOURCE
        value: "50"
      - key: LOG_LEVEL
        value: INFO
